<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `flowchart TD
  cli["main_sim.c: consola"] --> motor["simulador.c: CPU, dispositivos y ciclo de E/S"]
  gui["main_gui.c: interfaz"] --> motor
  motor --> teclado["teclado.c: genera vector de teclado"]
  teclado --> pic["PIC interno de simulador.c"]
  pic --> isr["ISR interna: atender resultado y EOI"]
  isr --> retorno["Restaurar contexto del mismo flujo"]
  retorno --> motor
  subgraph academicos["Modulos academicos independientes del motor"]
    cpu["cpu_core.c"]
    contexto["context_switch.c"]
    ivt["vector_interruptions.c"]
  end
`;
const { svg } = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;
</script>
